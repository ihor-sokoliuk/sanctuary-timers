name: Windows build and tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure native C++ build
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Unit and offscreen rendering tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Installer tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\installer_tests.ps1
      - name: Package versioned release
        shell: powershell
        run: .\scripts\New-ReleasePackage.ps1 -Executable .\build\Release\SanctuaryTimers.exe
      - uses: actions/upload-artifact@v4
        with:
          name: SanctuaryTimers-win-x64
          path: release/*
